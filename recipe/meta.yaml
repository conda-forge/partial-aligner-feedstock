{% set name = "Partial-Aligner" %}
{% set version = "0.0.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/Partial-Aligner-{{ version }}.tar.gz
  sha256: cd4631241785b4cbc320aac9d8b7c380f9a21e6c59a6005e92258784b390b836

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 1

requirements:
  host:
    - pip
    - python {{ python_min }}
    - setuptools-scm
  run:
    - dask-core
    - napari
    - napari-plugin-engine >=0.1.4
    - magicgui
    - numpy
    - packaging
    - python >={{ python_min }}

test:
  imports:
    - Partial_Aligner
  commands:
    - pip list
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/DKFZ-TMTRR/Partial-Aligner
  summary: A napari plugin for manual registration of (a part of) an image
  license: BSD-3-Clause
  license_file: LICENSE

extra:
  recipe-maintainers:
    - goanpeca
    - jaimergp
    - MBPhys
    - RobAnKo
